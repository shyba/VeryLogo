[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stc-compiler"
version = "0.1.0"
description = "Space-Time Compiler: HDL to explicit sequential machines, with solver-guided optimization and codegen for AVR, x86 SIMD, PTX, and Futhark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VeryLogo contributors" }]
keywords = ["hdl", "verilog", "compiler", "smt", "z3", "simd", "cuda", "ptx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "z3-solver>=4.12",
    "msgpack>=1.0",
]

[project.optional-dependencies]
dev = ["black==24.10.0"]

[project.scripts]
stc = "stc.cli:main"

[tool.setuptools]
packages = ["stc"]

[tool.black]
line-length = 88
target-version = ["py312"]
